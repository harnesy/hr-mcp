# http context (for example /etc/nginx/conf.d/harnsy-hr-mcp-limits.conf). Request limits of the MCP endpoint.
# Per address: an install is a handful of calls (list the tools, search, read an employee, a file or twenty).
limit_req_zone $binary_remote_addr zone=harnsy_hr_mcp:10m rate=60r/m;
# A ceiling for everyone together: hosted clients (claude.ai, ChatGPT) call from a few shared addresses, so the
# per-address limit alone does not hold them.
limit_req_zone $server_name zone=harnsy_hr_mcp_all:1m rate=50r/s;
